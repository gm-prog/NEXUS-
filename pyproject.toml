[project]
name = "nexus-benchmarks"
version = "0.1.0"
description = "NEXUS Phase 0: Benchmark schemas, validation CLI, and incident scenario fixtures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0",
    "referencing>=0.35.0",
    "rfc3339-validator>=0.1.4",
    "rpds-py>=0.19.0",
]
license = {text = "MIT"}
authors = [
    {name = "NEXUS Team", email = "team@nexus.local"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["benchmark", "incident", "observability", "validation", "json-schema"]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
]

# NOTE: dependencies are declared as minimum version bounds only. There is no
# committed lockfile; see SECURITY.md ("Supply Chain") and CONTRIBUTING.md.
[project.scripts]
nexus-benchmark = "nexus_benchmarks.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_benchmarks"]

# The benchmark schemas and incident fixtures live at the repository root so
# that docs and contributors reference one copy. They are also shipped inside
# the package so the installed CLI works from a built wheel, outside any
# checkout (see src/nexus_benchmarks/assets.py).
[tool.hatch.build.targets.wheel.force-include]
"benchmarks" = "nexus_benchmarks/benchmarks"

[tool.hatch.build.targets.sdist]
include = [
    "benchmarks",
    "docs",
    "src",
    "tests",
    ".github",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
preview = true
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20", "SIM", "RET", "ARG", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "TCH", "INT"]
lint.ignore = []
format.quote-style = "double"
format.skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Test assertion style: `assert` and hardcoded pytest fixture arguments are the
# point of the file, so the "assert" and "possible hardcoded password" rules
# are switched off for tests only.
"tests/*" = ["S101", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "schema: Schema validation tests",
    "cli: CLI tests",
]
