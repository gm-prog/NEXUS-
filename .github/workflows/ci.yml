name: CI

# The default branch of this repository is `master`. Triggers must match it,
# otherwise the workflow never runs and the status checks stay empty.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Action pins (verified against upstream release notes, 2026-10-10):
#
#   actions/checkout@v4 and actions/setup-python@v5 declare `using: node20`.
#   GitHub deprecated Node 20 for JavaScript actions: Node 20 actions were
#   forced onto Node 24 from 2026-06-02 and Node 20 is removed from the runner
#   from 2026-09-16, so both majors now emit end-of-job warnings and are on
#   borrowed time.
#
#   actions/checkout@v7.0.1        -> `using: node24`
#   actions/setup-python@v7.0.0    -> `using: node24`
#
# Breaking changes reviewed before bumping, both no-ops for this workflow:
#   * checkout v5.1.0 "backport `allow-unsafe-pr-checkout`" — only changes
#     `pull_request_target` checkout defaults. This workflow triggers on
#     push / pull_request / workflow_dispatch only, never pull_request_target.
#   * setup-python v7.0.0 "Remove the pip-install input" — this workflow never
#     sets `pip-install`; it installs via `python -m pip install`.
#
# Both node24 actions require runner v2.327.1 or later; `ubuntu-latest`
# satisfies that. If a hosted run ever reports a runner-version failure, fall
# back to checkout@v5.1.0 / setup-python@v6.3.0, which are also node24.
#
# Follow-up (owner: NEXUS maintainers; trigger: next CI maintenance window):
# move to SHA-pinned actions once a Dependabot or pinning policy is adopted.

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -v

      - name: Installed CLI help
        run: nexus-benchmark --help

      - name: List benchmarks (sanity check)
        run: nexus-benchmark list

      - name: Validate benchmarks
        run: nexus-benchmark validate

  package:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      # Builds a wheel, installs it into a clean virtual environment and runs
      # the console script from a directory outside this checkout.
      - name: Build and run the installed CLI outside the checkout
        run: ./scripts/wheel_smoke_test.sh
