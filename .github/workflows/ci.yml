name: CI

# The default branch is master; PR #1 is the scoped Phase 0 correction.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Official release git refs and Node 24 action runtimes verified 2026-10-10.
# Tags are explanatory only: execution uses immutable full commit SHAs.
# https://github.com/actions/checkout/releases/tag/v7.0.1
# https://github.com/actions/setup-python/releases/tag/v7.0.0
# https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0
permissions:
  contents: read

env:
  # Never silently download a different interpreter during dependency setup.
  UV_PYTHON_DOWNLOADS: never

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up locked dependency tooling
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Enforce lock and install dependencies without build isolation
        run: ./scripts/locked_sync.sh

      - name: Verify Python matrix interpreter
        run: |
          .venv/bin/python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python-version }}', sys.version"

      - name: Check formatting (Ruff)
        run: .venv/bin/ruff format --check .

      - name: Lint (Ruff)
        run: .venv/bin/ruff check .

      # Includes a stale-manifest negative test against the actual uv checker.
      - name: Run tests (pytest)
        run: .venv/bin/python -m pytest -v

      - name: Installed CLI help
        run: .venv/bin/nexus-benchmark --help

      - name: List benchmarks (sanity check)
        run: .venv/bin/nexus-benchmark list

      - name: Validate benchmarks
        run: .venv/bin/nexus-benchmark validate

  package:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up locked dependency tooling
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Builds without isolation, installs only hash-locked runtime wheels,
      # then installs the local wheel --no-deps --no-index in a fresh venv.
      - name: Build and run the installed CLI outside the checkout
        run: |
          ./scripts/wheel_smoke_test.sh
          .venv/bin/python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
