name: CI

# The default branch of this repository is `master`. Triggers must match it,
# otherwise the workflow never runs and the status checks stay empty.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -v

      - name: Installed CLI help
        run: nexus-benchmark --help

      - name: List benchmarks (sanity check)
        run: nexus-benchmark list

      - name: Validate benchmarks
        run: nexus-benchmark validate

  package:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      # Builds a wheel, installs it into a clean virtual environment and runs
      # the console script from a directory outside this checkout.
      - name: Build and run the installed CLI outside the checkout
        run: ./scripts/wheel_smoke_test.sh
