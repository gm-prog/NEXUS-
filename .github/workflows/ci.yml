name: CI

# The default branch of this repository is `master`. Triggers must match it,
# otherwise the workflow never runs and the status checks stay empty.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Node 24 action releases verified from official release notes/action.yml on
# 2026-10-10. checkout v7's unsafe-PR guard does not affect our pull_request
# event; setup-python v7 removes pip-install, which we never used. Installation
# remains a separate `python -m pip` step. GitHub-hosted ubuntu-latest is supported.
# https://github.com/actions/checkout/releases/tag/v7.0.1
# https://github.com/actions/setup-python/releases/tag/v7.0.0
# The previous checkout@v4/setup-python@v5 declared node20 and emitted warnings.
# SHA-pinning is a maintainer follow-up before a future merge, not claimed here.

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -v

      - name: Installed CLI help
        run: nexus-benchmark --help

      - name: List benchmarks (sanity check)
        run: nexus-benchmark list

      - name: Validate benchmarks
        run: nexus-benchmark validate

  package:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      # Builds a wheel, installs it into a clean virtual environment and runs
      # the console script from a directory outside this checkout.
      - name: Build and run the installed CLI outside the checkout
        run: ./scripts/wheel_smoke_test.sh
